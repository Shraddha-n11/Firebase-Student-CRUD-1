<body style="background: linear-gradient(90deg,rgba(157, 224, 250, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);;">

                                 <input required class="form-control" type="text" id="Author">
                                    </div>
                                    <div class="form-group">
                                <label for="rating" >Rating</label>
                                 <input required min="0" max="5" class="form-control" type="number" id="rating">
                        </div>
                        <button type="submit" class="btn btn-sm btn-block btn-primary" id="SubmitBtn">Submit</button>
                        <button type="button" class="btn btn-sm btn-block btn-danger d-none" id="UpdateBtn">Update</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4 offset-md-1">
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-bordered ">
                                <thead class="table table-success">
                                    <tr>
                                        <th>Sr.no</th>
                                        <th>Book title</th>
                                        <th>Author</th>
                                        <th>Rating</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody id="data">

                                        <td><i class="fa-solid fa-pen-to-square fa-2x text-primary align-item-center"></i>
</td>
                                        <td><i class="fa-solid fa-trash-can fa-2x text-danger align-item-center"></i>
</td>
                                    </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
